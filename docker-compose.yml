services:
  postgres:
    image: postgres:15
    container_name: hirelog-db
    environment:
      POSTGRES_DB: hirelogdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: hirelog-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: